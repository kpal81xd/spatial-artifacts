<title>Garden Bedroom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
    :root {
        color-scheme: light;
        --page-bg: #f1f2ef;
        --scene-bg: #c6d9e6;
        --ink: #1d2320;
        --muted: #59625d;
        --panel: #f6f7f4e6;
        --line: #c8cec8;
        --accent: #2c6b5a;
        --on-accent: #f4f7f5;
        --sans: 'IBM Plex Sans', system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;

        /* the editing toolbar is viewer chrome: it takes the viewer's comment orange in every theme, like the comment outlines */
        --tool: #c96442;
        --on-tool: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --page-bg: #101312;
            --scene-bg: #7d97ab;
            --ink: #e3e8e4;
            --muted: #98a29c;
            --panel: #1d2220e6;
            --line: #333b37;
            --accent: #79c2a9;
            --on-accent: #0f1412;
        }
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #101312;
        --scene-bg: #7d97ab;
        --ink: #e3e8e4;
        --muted: #98a29c;
        --panel: #1d2220e6;
        --line: #333b37;
        --accent: #79c2a9;
        --on-accent: #0f1412;
    }
    body { margin: 0; padding-block: 20px; padding-inline: 16px; background: var(--page-bg); color: var(--ink); font: 15px/1.45 var(--sans); }
    h1 { margin: 0 0 14px; font-size: 19px; font-weight: 600; text-wrap: balance; }
    .scenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
    .scene { display: flex; flex-direction: column; gap: 8px; }
    .view { position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--scene-bg); }
    .scenes:has(.scene + .scene) .view { aspect-ratio: 4 / 3; }
    .scene-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* stacked scenes on a phone leave vertical swipes to the page, so it still scrolls; full screen takes them all back */
    @media (max-width: 700px) { .scenes:has(.scene + .scene) .scene-canvas { touch-action: pan-y; } }
    :root[data-fullscreen] .scene[data-max] .scene-canvas { touch-action: none; }

    /* the hud's text lets clicks through to the scene, so comments and orbits reach what is under it; it stops short of the corner button */
    .hud { position: absolute; top: 12px; left: 12px; right: 58px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
    .hud > .tools { pointer-events: auto; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
    .tools { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    .tools[hidden] { display: none; }
    .tools button { position: relative; display: grid; place-items: center; color: var(--ink); background: transparent; border: 0; border-radius: 5px; padding: 7px; cursor: pointer; }
    .tools button:disabled { cursor: default; }
    .tools button:disabled svg { opacity: 0.4; }
    .tools svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    [data-action="space"][aria-pressed="true"] .world, [data-action="space"]:not([aria-pressed="true"]) .local { display: none; }

    /* tooltips read the button's aria-label; the tool buttons anchor left so the long move-only note stays inside the scene */
    .tools button::after { content: attr(aria-label); position: absolute; top: calc(100% + 6px); left: 50%; translate: -50% 0; z-index: 1; width: max-content; max-width: 220px; padding: 4px 7px; border-radius: 4px; background: var(--ink); color: var(--page-bg); font: 12px/1.3 var(--sans); text-align: start; pointer-events: none; opacity: 0; transition: opacity 0.12s; }
    .tools [data-tool]::after { left: 0; translate: none; }
    .tools button:is(:hover, :focus-visible)::after { opacity: 1; transition-delay: 0.35s; }
    .tools button:hover { background: color-mix(in srgb, var(--tool) 18%, transparent); }
    .tools button[aria-pressed="true"] { background: var(--tool); color: var(--on-tool); }
    .tools button:focus-visible { outline: 2px solid var(--tool); outline-offset: 1px; }
    .corner { position: absolute; top: 12px; right: 12px; }

    /* the corner button's tooltip opens to its left, inside the scene */
    .corner button::after { top: 50%; left: auto; right: calc(100% + 6px); translate: 0 -50%; }
    [data-action="fullscreen"][aria-pressed="true"] .enter, [data-action="fullscreen"]:not([aria-pressed="true"]) .exit { display: none; }

    /* full screen: the viewer takes its frame full screen, keeping the comment box, and this scene fills the page */
    :root[data-fullscreen] .scene[data-max] { position: fixed; inset: 0; z-index: 1; }
    :root[data-fullscreen] .scene[data-max] h2 { display: none; }
    :root[data-fullscreen] .scene[data-max] .view { aspect-ratio: auto; height: 100%; border: 0; border-radius: 0; }
    .sep { width: 1px; margin: 3px 4px; background: var(--line); }
    .meta { margin: 0; font: 12px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
    .meta:empty { display: none; }
</style>
