name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Version increment
                type: choice
                options: [patch, minor, major]
                default: patch

concurrency:
    group: release

permissions:
    contents: write

jobs:
    release:
        name: Release
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # every manifest carries the version; bump them together so users never install a mismatched plugin
            - name: Bump versions
              id: bump
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  cur=$(jq -r .version plugins/spatial-artifacts/.claude-plugin/plugin.json)
                  IFS=. read -r major minor patch <<< "$cur"
                  case "$BUMP" in
                      major) next="$((major + 1)).0.0" ;;
                      minor) next="$major.$((minor + 1)).0" ;;
                      patch) next="$major.$minor.$((patch + 1))" ;;
                  esac
                  if git ls-remote --exit-code --tags origin "refs/tags/v$next" > /dev/null; then
                      echo "::error::tag v$next already exists"; exit 1
                  fi
                  plugins=(plugins/spatial-artifacts/.claude-plugin/plugin.json plugins/spatial-artifacts/.codex-plugin/plugin.json)
                  markets=(.claude-plugin/marketplace.json .agents/plugins/marketplace.json)
                  sed -i "s/\"version\": \"$cur\"/\"version\": \"$next\"/" "${plugins[@]}" "${markets[@]}"
                  for f in "${plugins[@]}"; do
                      got=$(jq -r .version "$f")
                      [ "$got" = "$next" ] || { echo "::error file=$f::version $got, want $next"; exit 1; }
                  done
                  for f in "${markets[@]}"; do
                      got=$(jq -r '.plugins[] | select(.name == "spatial-artifacts") | .version' "$f")
                      [ "$got" = "$next" ] || { echo "::error file=$f::version $got, want $next"; exit 1; }
                  done
                  echo "tag=v$next" >> "$GITHUB_OUTPUT"

            # atomic so main and the tag land together or not at all
            - name: Commit and tag
              env:
                  TAG: ${{ steps.bump.outputs.tag }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
                  git commit -am "chore: release $TAG"
                  git tag -a "$TAG" -m "$TAG"
                  git push --atomic origin HEAD:refs/heads/main "$TAG"

            # a fixed install header, then github's notes: the merged pull requests since the previous tag
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.bump.outputs.tag }}
              run: |
                  gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$(cat <<'EOF'
                  3D design for Claude Code, the way Artifacts handles UI. Ask Claude for a 3D mockup, orbit it, move things with gizmos and leave comments on objects; Claude reads each comment, changes the scene and replies.

                  ## Install

                  ```
                  /plugin marketplace add kpal81xd/spatial-artifacts
                  /plugin install spatial-artifacts@kpal
                  /reload-plugins
                  ```

                  Requires Node 22.18 or later. Codex: see the [README](https://github.com/kpal81xd/spatial-artifacts#install).

                  A community project, not affiliated with or endorsed by Anthropic.
                  EOF
                  )"
